name: weather_app
description: "A premium weather application with real-time data and beautiful UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8

  # HTTP requests for API calls
  http: ^1.2.0

  # Date and time formatting
  intl: ^0.19.0

  # Location services
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Uncomment if you add custom assets
  # assets:
  #   - assets/images/
  #   - assets/icons/